<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Photo</title>


  <style>
    html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background: #003A63;
}

body {
    position: fixed;
    inset: 0;
}

#photo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    object-fit: cover;
    object-position: center top;

    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    }
 @media (min-width: 400px) {
    #photo {
        width: 100vw;
        height: 100dvh);
        object-fit: fill;
    }
}
    #backButton {
    position: fixed;
    top: 7%;
    right: 5%;
    width: 70px;
    height: 70px;

    border: none;
    background: transparent;
    padding: 0;
    z-index: 10;

    pointer-events: none;
}
    #screenSize {
    position: fixed;
    top: 180px;
    left: 10px;
    z-index: 9999;
    background: red;
    color: white;
    font-size: 18px;
    padding: 5px;
}
  </style>
</head>

<body>

  <img id="photo" src="image4.png">
  <div id="screenSize"></div>
  <button id="backButton" aria-label="Return"></button>

<script>
const photo = document.getElementById("photo");
const backButton = document.getElementById("backButton");

let showingSecond = false;
let lastTap = 0;

function showSecondImage() {
    if (!showingSecond) {
        showingSecond = true;
        photo.src = "image5.png";

        // Turn on the invisible top-right button
        backButton.style.pointerEvents = "auto";
    }
}

function showFirstImage() {
    showingSecond = false;
    photo.src = "image4.png";

    // Turn the invisible button back off
    backButton.style.pointerEvents = "none";
}

photo.addEventListener("touchend", function(event) {
    const now = Date.now();
    const timeBetweenTaps = now - lastTap;

    if (
        !showingSecond &&
        timeBetweenTaps > 40 &&
        timeBetweenTaps < 400
    ) {
        event.preventDefault();
        showSecondImage();
        lastTap = 0;
    } else {
        lastTap = now;
    }
}, { passive: false });

photo.addEventListener("dblclick", function(event) {
    event.preventDefault();

    if (!showingSecond) {
        showSecondImage();
    }
});

backButton.addEventListener("click", function(event) {
    event.preventDefault();
    event.stopPropagation();

    if (showingSecond) {
        showFirstImage();
    }
});
  function showScreenSize() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    const screenW = window.screen.width;
    const screenH = window.screen.height;

    const visualW = window.visualViewport
        ? Math.round(window.visualViewport.width)
        : "N/A";

    const visualH = window.visualViewport
        ? Math.round(window.visualViewport.height)
        : "N/A";

    document.getElementById("screenSize").innerHTML =
        "inner: " + w + " × " + h + "<br>" +
        "screen: " + screenW + " × " + screenH + "<br>" +
        "visual: " + visualW + " × " + visualH;
}

showScreenSize();
window.addEventListener("resize", showScreenSize);

if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", showScreenSize);
}
  
</script>

</body>
</html>
