<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Photo</title>


  <style>
    html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background: #003A63;
}

body {
    position: fixed;
    inset: 0;
}

#photo {
    position: fixed;
    top: 20px;
    left: 0;

    width: 100%;
    height: calc(100dvh - 20px);

    object-fit: fill;

    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
 
    #backButton {
    position: fixed;
    top: 7%;
    right: 5%;
    width: 70px;
    height: 70px;

    border: none;
    background: transparent;
    padding: 0;
    z-index: 10;

    pointer-events: none;
}

    .locations-button {
    position: fixed;
    bottom: 0;
    left: 33.33%;
    width: 33.33%;
    height: 8%;
    z-index: 20;
}

.settings-button {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 33.33%;
    height: 8%;
    z-index: 20;
}
    
  </style>
</head>

<body>

  <img id="photo" src="image4.png">

   <button id="locationsButton" class="locations-button" aria-label="Locations"></button>
  <button id="settingsButton" class="settings-button" aria-label="Settings"></button>
  
  <button id="backButton" aria-label="Return"></button>

<script>
const photo = document.getElementById("photo");
const backButton = document.getElementById("backButton");

let showingSecond = false;
let lastTap = 0;

function showSecondImage() {
    if (!showingSecond) {
        showingSecond = true;
        photo.src = "image5.png";

        // Turn on the invisible top-right button
        backButton.style.pointerEvents = "auto";
    }
}

function showFirstImage() {
    showingSecond = false;
    photo.src = "image4.png";

    // Turn the invisible button back off
    backButton.style.pointerEvents = "none";
}

photo.addEventListener("touchend", function(event) {
    const now = Date.now();
    const timeBetweenTaps = now - lastTap;

    if (
        !showingSecond &&
        timeBetweenTaps > 40 &&
        timeBetweenTaps < 400
    ) {
        event.preventDefault();
        showSecondImage();
        lastTap = 0;
    } else {
        lastTap = now;
    }
}, { passive: false });

photo.addEventListener("dblclick", function(event) {
    event.preventDefault();

    if (!showingSecond) {
        showSecondImage();
    }
});

backButton.addEventListener("click", function(event) {
    event.preventDefault();
    event.stopPropagation();

    if (showingSecond) {
        showFirstImage();
    }
});
  
</script>

</body>
</html>
