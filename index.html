<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Photo</title>


  <style>
    html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background: #003A63;
}

body {
    position: fixed;
    inset: 0;
}

#photo {
    position: fixed;
    top: 35px;
    left: 0;

    width: 100%;
    height: calc(100dvh - 70x);

    object-fit: cover;

    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
 
    #backButton {
    position: fixed;
    top: 7%;
    right: 5%;
    width: 70px;
    height: 70px;

    border: none;
    background: transparent;
    padding: 0;
    z-index: 10;

    pointer-events: none;
}

/* All three bottom navigation buttons */
.dashboard-button,
.locations-button,
.settings-button {
    position: fixed;
    bottom: 0;
    width: 33.33%;
    height: 8%;

    background: transparent;
    z-index: 9999;

    pointer-events: auto;
    touch-action: manipulation;
    cursor: pointer;
}

.dashboard-button {
    left: 0;
}

.locations-button {
    left: 33.33%;
}

.settings-button {
    left: 66.66%;
}

button.locations-button,
button.settings-button,
button.dashboard-button {
    background: none !important;
    background-color: transparent !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    appearance: none !important;
    -webkit-appearance: none !important;
    padding: 0 !important;
}

  </style>
</head>

<body>

  <img id="photo" src="image6.png">

<div id="dashboardButton" class="dashboard-button"></div>
<div id="locationsButton" class="locations-button"></div>
<div id="settingsButton" class="settings-button"></div>
  
  <button id="backButton" aria-label="Return"></button>

<script>
const photo = document.getElementById("photo");
const backButton = document.getElementById("backButton");
const dashboardButton = document.getElementById("dashboardButton");
const locationsButton = document.getElementById("locationsButton");
const settingsButton = document.getElementById("settingsButton");

let showingSecond = false;
let lastTap = 0;

function showSecondImage() {
    if (!showingSecond) {
        showingSecond = true;
        photo.src = "image5.png";

        // Turn on the invisible top-right button
        backButton.style.pointerEvents = "auto";
    }
}

function showFirstImage() {
    showingSecond = false;
    photo.src = "image6.png";

    // Turn the invisible button back off
    backButton.style.pointerEvents = "none";
  
}
dashboardButton.addEventListener("click", function() {
    photo.src = "image6.png";
  
});

  dashboardButton.addEventListener("click", function() {
    showFirstImage();
});

locationsButton.addEventListener("click", function() {
    photo.src = "Location.png";
    photo.style.objectFit = "cover";
});

settingsButton.addEventListener("click", function() {
    photo.src = "Settings.png";
    photo.style.objectFit = "cover";
});

  
photo.addEventListener("touchend", function(event) {
    const now = Date.now();
    const timeBetweenTaps = now - lastTap;

    if (
        !showingSecond &&
        timeBetweenTaps > 40 &&
        timeBetweenTaps < 400
    ) {
        event.preventDefault();
        showSecondImage();
        lastTap = 0;
    } else {
        lastTap = now;
    }
}, { passive: false });

photo.addEventListener("dblclick", function(event) {
    event.preventDefault();

    if (!showingSecond) {
        showSecondImage();
    }
});

backButton.addEventListener("click", function(event) {
    event.preventDefault();
    event.stopPropagation();

    if (showingSecond) {
        showFirstImage();
    }
});
  
</script>

</body>
</html>
